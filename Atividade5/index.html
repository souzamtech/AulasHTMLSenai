<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste com JAVASCRIPT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="container p-5">
    <main>
        <h1>Teste com JAVASCRIPT</h1>
        <!--Comentário HTML-->
        <div class="container">
            <form>
                <div class="mb-3"> <label class="form-label" for="nome">Digite seu nome:</label>

                    <input class="form-control p-3" id="nome" type="text" placeholder="Ex: João Silva">
                </div>

                <button class="btn btn-primary p-1" onclick="imprimirNome()">Enviar nome</button>
            </form>
            <!--COMENTÁRIO HTML- PROFESSOR MOSTRA COMO O ALERTA ABAIXO APARECE.-->

            <script>
                function imprimirNome() {
                    window.alert("Seu formulário foi enviado")
                }
            </script>

        </div>
    </main>

</body>

</html>
