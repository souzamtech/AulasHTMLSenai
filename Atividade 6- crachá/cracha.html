<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crachá virtual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<style>
    body {
        margin-left: -10px;

    }
</style>

<body class="container p-150">
    <form>
        <h2>Crachá virtual do colaborador</h2>

        <label>Nome:</label>
        <input type="text" id="nome"><br><br>

        <label>Idade:</label>
        <input type="number" id="Idade"><br><br>

        <label>Cargo:</label>
        <input type="Desenvolvedor Júnior- Java" id="cargo" value="Desenvolvedor Júnior"><br><br>

        <label>Departamento do colaborador:</label>
        <input type="text" id="Departamento" value="Informática- TIC"><br><br>

        <label>
            <input type="checkbox" id="acessoRestrito"> Possui Acesso Restrito?
        </label><br><br>

        <button class="btn btn-primary p-1" onclick="gerarCracha()">Verificar acesso</button>

    </form>
    <script src="cracha.js">

    </script>


</body>

</html>
