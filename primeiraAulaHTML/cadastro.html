<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>

    <h1>Cadastro de novo usuário</h1>

    <div>
        <img src="" 
             width="250">
    </div>

    <form>
        <div>
            <label for="campo-nome">Nome Completo:</label>
            <input type="text" id="campo-nome" placeholder="Digite seu nome completo">
        </div>

        <p>

        <div>
            <label for="campo-email">E-mail:</label>
            <input type="email" id="campo-email" placeholder="Ex: nome@email.com">
        </div>

        <p>

        <div>
            <label for="campo-senha">Crie uma Senha:</label>
            <input type="password" id="campo-senha" placeholder="Mínimo 6 caracteres">
        </div>

        <br>

        <button type="submit">Cadastrar Conta</button>
    </form>
    
    <!-- Exemplos práticos de uso:
Separar seções: Separar o conteúdo principal da página dos links úteis do rodapé (exatamente como está sendo feito no seu código de cadastro).

Mudança de assunto: Em um artigo de blog, separar o fim da história do início da seção de "Sobre o Autor".

Divisão de produtos: Em uma loja virtual, colocar uma linha separando um produto do outro em uma lista.-->
    <hr>

    <p>
        <a href="index.html">Voltar para o Login</a>
    </p>

</body>
</html>
