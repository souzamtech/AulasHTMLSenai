<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testes funções</title>
</head>

<body>
    <main>
        <h2>Calculadora</h2>

        <label for="primeiro-numero">Digite o primeiro número:</label>
        <input type="number" id="primeiro-numero">
        <br><br>

        <label for="segundo-numero">Digite o segundo número:</label>
        <input type="number" id="segundo-numero">
        <br><br>

        <button type="button" onclick="soma()">Soma</button>
        <button type="button" onclick="subtracao()">Subtração</button>
        <button type="button" onclick="multiplicacao()">Multiplicação</button>
        <button type="button" onclick="divisao()">Divisão</button>
        <button type="button" onclick="apagar_historico()">Apagar Histórico</button> 
        <br><br>

        <hr> <h2>Cálculo de Imposto de Importação</h2>

        <label for="Calculo de Impostos">Digite o valor do produto (USD):</label>
        <input type="number" id="Calculo de Impostos" placeholder="Ex: 50.00 USD">
        <br><br>

        <button type="button" onclick="calculo_Impostos()">Calcular Imposto</button>
        <br><br>

        <p>Seu resultado é: <strong id="resultado"></strong></p>
    </main>

    <h3>Histórico de operações está no inspecionar</h3>
    <div id="Histórico"></div>

    <script src="js/funcoes.js"></script>
</body>

</html>
